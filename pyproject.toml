[project]
name = "physearth-agent"
version = "0.1.0"
description = "An open-source GeoAI agent for physical Earth models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "gradio>=5",
    "smrt>=1.5,<2",
    "numpy>=2,<3",
    "matplotlib>=3.7,<4",
    "pyyaml>=6",
    "openai>=1.40",
    "pywatershed==3.0.0",
    "prosail==2.0.5",
    "pyet==1.5.0",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physearth"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
