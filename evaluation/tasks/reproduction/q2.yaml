id: q2-dmrt-comparison
paper: smrt-v1
paper_title: "SMRT: an active-passive microwave radiative transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
paper_doi: 10.5194/gmd-11-2763-2018
question: >-
  Reproduce Figures 4 and 5, "Comparison with other reference models" and "Radius and
  stickiness sensitivity", from the paper "SMRT: an active-passive microwave radiative
  transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
  by Picard et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section 3.1.2. Determine whether
  the registered SMRT model can reproduce the paper's passive brightness temperatures and
  active backscatter comparisons with DMRT-ML and DMRT-QMS under identical conditions,
  and whether any remaining discrepancies can be attributed to electromagnetic formulation,
  short-range approximation, or radiative-transfer solver effects. The final answer must
  answer that question, identify which reference models are unavailable locally, compare
  generated charts with Figures 4 and 5, and distinguish direct reproduction from partial
  comparison or unavailable external-model evidence.
paper_figures: [fig04.png, fig05.png]
paper_section: "3.1.2"
figure_targets:
