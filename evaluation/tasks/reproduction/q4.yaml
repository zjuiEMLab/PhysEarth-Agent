id: q4-microstructure-equivalence
paper: smrt-v1
paper_title: "SMRT: an active-passive microwave radiative transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
paper_doi: 10.5194/gmd-11-2763-2018
question: >-
  Reproduce Figures 7 and 8, "Grain-size scaling equivalence" and "Exponential-correlation
  scaling equivalence", from the paper "SMRT: an active-passive microwave radiative transfer
  model for snow with multiple microstructure and scattering formulations (v1.0)" by Picard
  et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section 3.2. Determine whether sticky hard
  spheres, scaled non-sticky spheres, and exponential autocorrelation functions can be
  parameterized to produce equivalent microwave brightness temperatures for snow with the
  same density and specific surface area, and whether that equivalence is unique and
  transferable across density, frequency, incidence angle, and polarization. The final
  answer must answer this question, compare generated charts with Figures 7 and 8, report
  root/bracketing or transferability limitations, and distinguish paper evidence from
  inference, user choices, and model assumptions.
paper_figures: [fig07.png, fig08.png]
paper_section: "3.2"
figure_targets:
  - id: fig07
    label: "Figure 7: Grain-size scaling equivalence"
  - id: fig08
    label: "Figure 8: Exponential-correlation scaling equivalence"

