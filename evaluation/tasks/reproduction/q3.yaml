id: q3-memls-comparison
paper: smrt-v1
paper_title: "SMRT: an active-passive microwave radiative transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
paper_doi: 10.5194/gmd-11-2763-2018
question: >-
  Reproduce Figure 6, "Comparison with MEMLS-IBA", from the paper "SMRT: an active-passive
  microwave radiative transfer model for snow with multiple microstructure and scattering
  formulations (v1.0)" by Picard et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section 3.1.3.
  When SMRT and MEMLS use the same exponential microstructure and snowpack properties,
  determine how closely they reproduce the electromagnetic coefficients and brightness
  temperatures, and how much of the difference can be attributed to the IBA absorption
  formulation versus the DORT and six-flux radiative-transfer solvers. The final answer
  must answer this question, compare the generated result with Figure 6, state whether
  MEMLS is executable or unavailable in the current environment, and label paper evidence,
  inference, user choices, and assumptions separately.
paper_figures: [fig06.png]
paper_section: "3.1.3"
figure_targets:
  - id: fig06
    label: "Figure 6: Comparison with MEMLS-IBA"

