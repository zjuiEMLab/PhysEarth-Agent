paper_title: "SMRT: an active-passive microwave radiative transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
paper_doi: 10.5194/gmd-11-2763-2018
question: >-
  Reproduce Figure 3, "Sparse-medium scattering coefficient comparison", from the paper
  "SMRT: an active-passive microwave radiative transfer model for snow with multiple
  microstructure and scattering formulations (v1.0)" by Picard et al. (2018,
  DOI: 10.5194/gmd-11-2763-2018), Section 3.1.1. Using the registered model and the
  paper evidence, determine under what snow-density range Rayleigh theory, DMRT-QCA-CP,
  and IBA across independent spheres, non-sticky hard spheres, and sticky hard spheres
  converge to the same first-order scattering behavior, and at what density particle
  correlation and dense-medium effects cause divergence. The final answer must explicitly
  answer this question, compare the model-generated result with Figure 3, state whether
  the reproduction is complete or partial, and distinguish paper-explicit values,
  paper-inferred values, user choices, and model assumptions.
paper_figures: [fig03.png]
