id: t1-smrt-fig4-passive
suite: tier2
tier: 2
legacy_id: t1-smrt-fig4-passive
title: Figure 4a of the SMRT paper, angular brightness temperature under DMRT
source:
  paper: smrt-v1
  section: "08"
  figure: Figure 4a
  doi: 10.5194/gmd-11-2763-2018
  quote: >-
    Figure 4 shows the angle dependence of the brightness temperature and backscattering
    coefficient for SMRT DMRT compared to other models for a semi-infinite medium with a
    sphere radius of 0.1 mm, density of 300 kg m-3, stickiness of tau=0.5, and temperature
    of 256 K.
quality: complete
shape: sweep
observable: passive
models: [smrt]
question: >-
  Reproduce the passive panel of Figure 4 of the SMRT paper: brightness temperature against
  incidence angle from 0 to 60 degrees at 37 GHz, for the semi-infinite snowpack that figure
  uses, with SMRT's DMRT QCA-CP short-range formulation. Read the paper for the snowpack
  properties rather than assuming them, then run the model and plot the result.
reference:
  model: smrt
  parameters:
    electromagnetic_model: dmrt_qcacp_shortrange
    microstructure_model: sticky_hard_spheres
    output: tb
    frequency_ghz: 37.0
    thickness_m: 10.0
    density_kg_m3: 300.0
    temperature_k: 256.0
    radius_m: 0.0001
    stickiness: 0.5
    sweep_parameter: angle_deg
    sweep_start: 0.0
    sweep_stop: 60.0
    sweep_points: 13
  graded_fields:
    - electromagnetic_model
    - microstructure_model
    - output
    - frequency_ghz
    - density_kg_m3
    - temperature_k
    - radius_m
    - stickiness
    - sweep_parameter
  curve:
    axis: angle_deg
    series: tb_v
    tolerance_rmse: 2.0
    unit: K
notes: >-
  Thickness is graded loosely because the paper says semi-infinite and the adapter has a
  finite ceiling; anything at or above a few metres is optically the same medium at 37 GHz.
