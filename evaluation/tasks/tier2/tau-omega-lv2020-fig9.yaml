question: >-
  Reproduce, qualitatively, Figure 9 of Lv, Schalge, Saavedra Garfias and Simmer (2020),
  "Required sampling density of ground-based soil moisture and brightness temperature
  observations for calibration and validation of L-band satellite observations based on a
  virtual reality" (Hydrology and Earth System Sciences 24, 1957-1973,
  DOI: 10.5194/hess-24-1957-2020). Read the paper and inspect the figure, then simulate how
  L-band brightness temperature at H and V polarization changes with soil moisture over the
  range the figure covers, and compare your chart with the figure. Say which features of the
  figure your simulation reproduces and which it cannot, and name every vegetation, roughness
  or soil setting you had to choose because the figure does not state it.
