id: q2-dmrt-comparison
suite: tier2
tier: 2
legacy_id: t1-smrt-fig4-active
evaluation_kind: scientific_question_demo
figure_target: fig04
paper_figures: [fig04.png, fig05.png]
title: SMRT scientific question 2, comparison with DMRT-based models
source:
  document: docs/smrt_section3_scientific_questions_and_steps.md
  section: "3.1.2"
  paper: smrt-v1
  doi: 10.5194/gmd-11-2763-2018
quality: complete
shape: research_demo
observable: passive_and_active
models: [smrt]
reference_models: [DMRT-ML, DMRT-QMS]
unavailable_models: [DMRT-ML, DMRT-QMS]
question: >-
  Reproduce Figures 4 and 5, "Comparison with other reference models" and "Radius and
  stickiness sensitivity", from the paper "SMRT: an active-passive microwave radiative
  transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
  by Picard et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section 3.1.2. Read and inspect
  both source figures, then answer whether SMRT can reproduce the passive brightness
  temperatures and active backscatter predicted by DMRT-ML and DMRT-QMS under identical
  conditions, and whether remaining discrepancies can be attributed to electromagnetic
  formulation, short-range approximation, or radiative-transfer solver. Do not substitute
  one SMRT configuration for an unavailable external model; compare generated local charts
  with Figures 4 and 5 and report partial/unavailable status explicitly.
demo:
  source_question: >-
    Can SMRT reproduce the passive and active observables of DMRT-ML and DMRT-QMS under
    identical conditions, and what component could explain any discrepancy?
  fixed_parameters:
    frequency_ghz: 37.0
    density_kg_m3: 300.0
    temperature_k: 256.0
    radius_m: 0.0001
    stickiness: 0.5
  pilot:
    angle_deg: [10.0, 35.0, 60.0]
    observables: [tb_v, tb_h, sigma_vv_db, sigma_hh_db]
    local_configurations:
      - dmrt_qcacp_shortrange
      - dmrt_qca_shortrange
  expected_outputs:
    - local SMRT passive and active pilot outputs where supported
    - a capability check for DMRT-ML and DMRT-QMS
    - coefficient-level and solver-level comparison plan
    - explicit partial or blocked status when an external reference model is unavailable
  required_behaviors:
    - read and inspect paper Figures 4 and 5 before proposing the chart package
    - do not label two SMRT configurations as independent DMRT implementations
    - do not infer attribution from a curve difference without controlled inputs
    - preserve native angle grids, units, polarization, and unsupported outputs
    - report what would be needed for the full cross-model comparison
  limitations:
    - this task is a paper-figure reproduction pilot; numeric curve digitization requires a separate user-reviewed step
    - DMRT-ML and DMRT-QMS are not assumed to be registered local models
