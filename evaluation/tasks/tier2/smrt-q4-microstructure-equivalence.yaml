id: q4-microstructure-equivalence
suite: tier2
tier: 2
legacy_id: t1-smrt-fig6-memls-iba
evaluation_kind: scientific_question_demo
figure_target: fig07
paper_figures: [fig07.png, fig08.png]
title: SMRT scientific question 4, microstructure equivalence
source:
  document: docs/smrt_section3_scientific_questions_and_steps.md
  section: "3.2"
  paper: smrt-v1
  doi: 10.5194/gmd-11-2763-2018
quality: complete
shape: research_demo
observable: equivalence_mapping
models: [smrt]
question: >-
  Reproduce Figures 7 and 8, "Grain-size scaling equivalence" and "Exponential-correlation
  scaling equivalence", from the paper "SMRT: an active-passive microwave radiative
  transfer model for snow with multiple microstructure and scattering formulations (v1.0)"
  by Picard et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section 3.2. Read and inspect
  both source figures, then answer whether sticky hard spheres, scaled non-sticky spheres,
  and exponential autocorrelation functions can be parameterized to produce equivalent
  microwave brightness temperatures for snow with the same density and specific surface
  area, and whether that equivalence is unique and transferable across density, frequency,
  incidence angle, and polarization. Compare generated charts with Figures 7 and 8 and
  report root, residual, and transferability limitations.
demo:
  source_question: >-
    Can different snow microstructure representations be mapped to equivalent brightness
    temperatures, and is the mapping unique and transferable?
  fixed_parameters:
    frequency_ghz: 37.0
    temperature_k: 265.0
    reference_radius_m: 0.0001
    calibration_angle_deg: 55.0
  pilot:
    density_kg_m3: [300.0]
    scaled_radius_m: [0.00008, 0.0001, 0.00012]
    calibration_observable: tb_v
    required_diagnostics: [bracket, residual, root_count]
  expected_outputs:
    - one reproducible calibration mapping or a documented inability to solve it
    - bracket and residual diagnostics for every attempted root
    - explicit treatment of multiple roots and missing brackets
    - a follow-up plan for density, frequency, angle, polarization, and active transfer tests
  required_behaviors:
    - read and inspect paper Figures 7 and 8 before proposing the chart package
    - do not call one-point agreement general equivalence
    - keep the calibration channel distinct from transferability tests
    - report solver failures and non-unique solutions as results
    - cite and apply the source relation for exponential correlation length
  limitations:
    - this task is a paper-figure reproduction pilot; numeric curve digitization requires a separate user-reviewed step
    - the one-density pilot cannot establish uniqueness or transferability
