question: >-
  Reproduce Figure 6, "Comparison with MEMLS-IBA", from the paper "SMRT: an active-passive
  microwave radiative transfer model for snow with multiple microstructure and scattering
  formulations (v1.0)" by Picard et al. (2018, DOI: 10.5194/gmd-11-2763-2018), Section
  3.1.3. Read and inspect Figure 6, first check whether MEMLS is available, and then answer:
  when SMRT and MEMLS use the same exponential microstructure and snowpack properties, how
  closely do they reproduce the electromagnetic coefficients and brightness temperatures,
  and how much of the difference can be attributed to IBA absorption versus DORT and
  six-flux radiative-transfer solvers? Do not present SMRT as MEMLS; compare the generated
  local chart with Figure 6 and mark unavailable external results explicitly.
demo:
  source_question: >-
    When SMRT and MEMLS use the same exponential microstructure and snowpack properties, how
    much of their difference is electromagnetic formulation versus radiative-transfer solver?
  fixed_parameters:
    frequency_ghz: 37.0
    density_kg_m3: 300.0
    temperature_k: 265.0
    corr_length_m: 0.0001
  pilot:
    angle_deg: [10.0, 35.0, 60.0]
    observables: [ks_per_m, ka_per_m, tb_v, tb_h]
    local_configurations: [iba_original, iba]
  expected_outputs:
    - capability result for MEMLS rather than an invented substitute
    - SMRT electromagnetic coefficients and brightness temperatures
    - a comparison of IBA formulation effects within SMRT
    - a controlled plan for separating electromagnetic and solver contributions
  required_behaviors:
    - read and inspect paper Figure 6 before proposing the chart package
    - distinguish unavailable MEMLS execution from a negative scientific result
    - cite the source for the exponential representation and correlation length
    - keep density, temperature, boundary, and angle conventions explicit
    - avoid claiming equivalence from one pilot channel
  limitations:
    - this task is a paper-figure reproduction pilot; numeric curve digitization requires a separate user-reviewed step
    - no MEMLS result may be fabricated when the external package is unavailable
