question: >-
  Reproduce Figure 11 of Modanesi, Massari, Gruber, Lievens, Tarpanelli, Morbidelli and De
  Lannoy (2021), "Optimizing a backscatter forward operator using Sentinel-1 data over
  irrigated land" (Hydrology and Earth System Sciences 25, 6283-6307,
  DOI: 10.5194/hess-25-6283-2021): the 2016-2017 time series of VV and VH backscatter at the
  Faenza field, Sentinel-1 observations against the calibrated water cloud model, for the
  natural and irrigation runs. Read the paper and inspect the figure first, then reproduce it
  with the registered models and data, or explain precisely what prevents a faithful
  reproduction.
