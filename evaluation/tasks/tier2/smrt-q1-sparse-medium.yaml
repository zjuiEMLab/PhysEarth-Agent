id: q1-sparse-medium
suite: tier2
tier: 2
legacy_id: t1-smrt-fig4-passive
evaluation_kind: scientific_question_demo
figure_target: fig03
paper_figures: [fig03.png]
title: SMRT scientific question 1, sparse-medium approximation
source:
  document: tasks/smrt_section3_scientific_questions_and_steps.md
  section: "3.1.1"
  paper: smrt-v1
  doi: 10.5194/gmd-11-2763-2018
quality: complete
shape: research_demo
observable: scattering_coefficient
models: [smrt]
question: >-
  Reproduce Figure 3, "Sparse-medium scattering coefficient comparison", from the paper
  "SMRT: an active-passive microwave radiative transfer model for snow with multiple
  microstructure and scattering formulations (v1.0)" by Picard et al. (2018,
  DOI: 10.5194/gmd-11-2763-2018), Section 3.1.1. Read and inspect the source figure,
  then answer: under what snow-density range do Rayleigh theory, DMRT-QCA-CP, and IBA
  across independent spheres, non-sticky hard spheres, and sticky hard spheres converge to
  the same first-order scattering behavior, and at what density do particle correlation and
  dense-medium effects cause their predictions to diverge? Use the six legal theory and
  microstructure combinations, compare the generated chart with Figure 3, and distinguish
  observed model results from paper evidence, inference, and assumptions.
demo:
  source_question: >-
    Under what snow-density range do Rayleigh theory, DMRT-QCA-CP sticky and DMRT-QCA-CP
    non-sticky hard sphere converge to the same first-order scattering behavior, and when do
    particle-correlation and dense-medium effects cause divergence?
  required_runs:
    - [rayleigh, independent_sphere]
    - [iba, independent_sphere]
    - [dmrt_qcacp_shortrange, non_sticky_hard_spheres]
    - [iba, non_sticky_hard_spheres]
    - [dmrt_qcacp_shortrange, sticky_hard_spheres]
    - [iba, sticky_hard_spheres]
  fixed_parameters:
    frequency_ghz: 37.0
    radius_m: 0.0001
  pilot:
    density_kg_m3: [1.0, 25.0, 50.0, 75.0, 96.0]
    output: ks
    comparison: six_theory_microstructure_configurations
  expected_outputs:
    - scattering coefficient against density
    - a model-generated comparison chart linked to paper Figure 3
    - low-density agreement or disagreement with the Rayleigh reference
    - finite-value and unit checks
    - explicit distinction between observed pilot behavior and full-sweep claims
  required_behaviors:
    - read and cite the source section before fixing paper parameters
    - read and inspect paper Figure 3 before proposing the chart
    - compare only combinations declared legal by the SMRT model card
    - include exactly the six required theory and microstructure combinations
    - preserve failed or unsupported configurations instead of silently dropping them
    - do not claim a breakdown density from the five-point pilot alone
  limitations:
    - this task is a paper-figure reproduction pilot; numeric curve digitization requires a separate user-reviewed step
    - the pilot does not establish the full validity range or causal attribution
