question: >-
  pywatershed 3.0.0, the USGS Python implementation of PRMS, ships the Sagehen Creek domain
  (Sierra Nevada, test_data/sagehen_5yr) as its worked example. Run the example for water
  year 1981 (1 October 1980 to 30 September 1981) and plot, on one chart, the monthly
  basin-mean snow water equivalent, snowmelt and surface runoff. Say in which month the
  snowpack peaks and how large it is, when melt is strongest, how much of the melt leaves as
  surface runoff, and what that implies about how water reaches the stream in this basin.
