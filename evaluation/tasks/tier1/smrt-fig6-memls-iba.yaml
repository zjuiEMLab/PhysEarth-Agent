id: t1-smrt-fig6-memls-iba
suite: tier1
title: Figure 6 of the SMRT paper, IBA on an exponential autocorrelation function
source:
  paper: smrt-v1
  section: "08"
  figure: Figure 6
  doi: 10.5194/gmd-11-2763-2018
  quote: >-
    The microstructure in SMRT is set to the exponential autocorrelation function as in MEMLS
    and depends on the correlation length, which is set to 100 um in this computation.
quality: complete
shape: point
observable: passive
models: [smrt]
question: >-
  For its comparison against MEMLS the SMRT paper runs one specific configuration. Set that
  configuration up and report the brightness temperature it gives at 37 GHz and 55 degrees.
  State which correlation length and which microstructure representation the paper used, and
  cite where you read it.
reference:
  model: smrt
  parameters:
    electromagnetic_model: iba
    microstructure_model: exponential
    output: tb
    frequency_ghz: 37.0
    angle_deg: 55.0
    thickness_m: 10.0
    density_kg_m3: 300.0
    temperature_k: 265.0
    corr_length_m: 0.0001
  graded_fields:
    - electromagnetic_model
    - microstructure_model
    - output
    - frequency_ghz
    - angle_deg
    - corr_length_m
  point:
    series: tb_v
    tolerance: 5.0
    unit: K
notes: >-
  Only the fields the paper states are graded. It gives the correlation length, the
  microstructure and the theory but not the density or the temperature, so those are held at
  the reference values for the numeric comparison and left ungraded for the configuration
  comparison. Grading a field the source does not fix would be grading a guess.
