version: "2026-10-02"
name: PhysEarth competition evaluation
scope: "Paper reproduction through the harness, compared with the direct-LLM raw baseline."

# The matrix `evaluation/runners/competition.py` plans and runs by default. Each cell is one
# task x prompt profile x configuration x LLM x repeat, cached independently.
execution:
  # `full` is the deployed Studio; `no-harness` is the direct-LLM raw baseline (publisher
  # PDF pages and an unassisted upstream SMRT tool, no structured corpus or gates).
  # The main LLM, chosen 2026-10-02. Models are not limited to the ModelScope switcher:
  # every run goes through the provider-neutral PHYSEARTH_LLM_* endpoint.
  configs: [full, no-harness]
  provider: openrouter
  llms:
    - openai/gpt-5.6-luna
  prompt_profiles:
    - p1-reproduction-first
  repeats: 3
  approval_policy: scripted_accept_unmodified_plan
  results_dir: evaluation/results/competition/runs

# Does the harness hold with other LLMs? The same core task, harness on, one repeat each.
robustness:
  tasks: [q1-sparse-medium]
  configs: [full]
  llms:
    - deepseek/deepseek-v4.1-flash
    - qwen/qwen3.8-flash
  repeats: 1

# Every registered model through protocol B: one reproduction task each, harness on, the
# main LLM. Run with `competition.py --grid`; each task is scored through its own fixture.
model_grid:
  tasks:
    - q1-sparse-medium
    - prosail-lai-benchmark
    - pyet-fao56-example18
    - pywatershed-sagehen-wy1981
    - tau-omega-lv2020-fig9
    - water-cloud-modanesi2021-fig11
  configs: [full]
  repeats: 1

# The label-blinded figure and report judge. Set through EVAL_LLM_MODEL; it must differ
# from every candidate LLM above, which judge.settings enforces.
judge:
  model: openai/gpt-6-luna

competition_required:
  t2_paper_reconstruction:
    core_tasks:
      - q1-sparse-medium
    probe_tasks:
      - p-smrt-density-above-ice

# Removed from the matrix in 35eee2c and kept here so the history stays legible. Their
# runners and tests are under tests/archive/ until they are restored or retired.
archived:
  tasks: [q2-dmrt-comparison, q3-memls-comparison, q4-microstructure-equivalence]
  prompt_profiles: [p0-explore-refine-produce, p3-uncertainty-aware]
  configs: [no-figures]
  runners:
    - evaluation/runners/dashboard.py
    - evaluation/runners/llm_smoke.py
    - evaluation/runners/llm_robustness.py

reporting:
  scored_records: evaluation/results/competition/scored_runs.json
