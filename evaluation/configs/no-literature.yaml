name: no-literature
description: >-
  The bundled corpus is removed: list_literature and read_literature are not offered,
  the catalogue and the method notes leave the system prompt, and the literature marker
  leaves the citation contract. The agent keeps every model, the full capability
  declaration, the reference data and the whole harness, so what it loses is knowledge,
  not guardrails.
switches:
  harness: true
  literature: false
  capability: true
