name: no-harness
description: >-
  Physical domain validation and the two final-answer gates are removed. A model call
  with an out-of-range or illegally combined parameter is passed straight to the model
  instead of being refused with its reason, and an answer whose citation markers resolve
  to nothing is delivered as written. Everything else, including the tool set and the
  full capability declaration, is unchanged.
switches:
  harness: false
  literature: true
  capability: true
