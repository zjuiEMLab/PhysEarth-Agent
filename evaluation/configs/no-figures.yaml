name: no-figures
description: >-
  The full research harness, structured article body and model cards remain, but source
  figure assets, captions, legends, axes metadata and figure tools are removed. Ordinary
  prose references to figures remain part of the paper text.
switches:
  harness: true
  literature: true
  capability: true
  figures: false
  paper_access: structured_text
  execution_access: harnessed_smrt
