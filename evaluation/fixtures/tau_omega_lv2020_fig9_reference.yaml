report_facts:
  - Figure 9 shows joint distributions, not single curves, of L-band brightness temperature at H and V polarization against soil moisture from a year of 400 m virtual-reality simulations.
  - Brightness temperature falls as soil moisture rises at both polarizations, and H lies below V and spans a wider range.
  - The relationship is non-unique; at a soil moisture of 0.4 the paper reports H from about 180 to 250 K and V from about 225 to 265 K, because vegetation, soil properties and terrain vary.
  - The figure does not state a single vegetation optical depth, single scattering albedo or roughness, so a single-curve reproduction has to assume them and can match the trend but not the spread.
