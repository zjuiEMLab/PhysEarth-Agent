report_facts:
  - Figure 11 compares Sentinel-1 sigma0 observations (VV and VH) with water cloud model simulations at the Faenza field over 2016-2017, after calibration with the KGE and J cost functions, for natural and irrigation runs.
  - The simulations are driven by Noah-MP surface soil moisture and leaf area index time series, and the observations are Sentinel-1 backscatter; neither time series is available to the system.
  - The registered water cloud model has no polarization input and no calibrated VV and VH parameter sets for Faenza.
  - A faithful reproduction is therefore not possible here; the correct response names the missing observations and forcing instead of drawing an invented time series.
