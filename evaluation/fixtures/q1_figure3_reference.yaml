schema_version: q1-figure3-reference-v2
task: q1-sparse-medium
scorer: figure3
source:
  repository: https://github.com/smrt-model/smrt_v1_paper
  commit: fb60a037a290c0add016d45f354cea37816b1515
  notebook: fig03_sparse_medium.ipynb
  notebook_raw_url: https://raw.githubusercontent.com/smrt-model/smrt_v1_paper/fb60a037a290c0add016d45f354cea37816b1515/fig03_sparse_medium.ipynb
  paper_doi: 10.5194/gmd-11-2763-2018
  paper_figure: fig03
recipe:
  source_sensor: AMSR-E 37V
  frequency_ghz: 36.5
  radius_m: 0.0001
  densities_kg_m3: [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96]
  sticky_stickiness: 0.15
  non_sticky_stickiness: 1000.0
curves:
  - id: independent_rayleigh
    label: Independent spheres (Rayleigh)
    electromagnetic_model: rayleigh
    microstructure_model: independent_sphere
    # The pinned notebook passes `shsl` here despite the independent-sphere legend.
    # Rayleigh uses only volume fraction and radius, so the numeric curve is unchanged.
    oracle_microstructure_model: sticky_hard_spheres
    oracle_stickiness: 0.15
  - id: independent_iba
    label: Independent spheres (IBA)
    electromagnetic_model: iba
    microstructure_model: independent_sphere
  - id: non_sticky_dmrt
    label: Non-sticky hard spheres (DMRT QCA-CP)
    electromagnetic_model: dmrt_qcacp_shortrange
    microstructure_model: sticky_hard_spheres
    stickiness: 1000.0
    accepted_microstructure_aliases: [non_sticky_hard_spheres]
  - id: non_sticky_iba
    label: Non-sticky hard spheres (IBA)
    electromagnetic_model: iba
    microstructure_model: sticky_hard_spheres
    stickiness: 1000.0
    accepted_microstructure_aliases: [non_sticky_hard_spheres]
  - id: sticky_dmrt
    label: Sticky hard spheres (DMRT QCA-CP)
    electromagnetic_model: dmrt_qcacp_shortrange
    microstructure_model: sticky_hard_spheres
    stickiness: 0.15
  - id: sticky_iba
    label: Sticky hard spheres (IBA)
    electromagnetic_model: iba
    microstructure_model: sticky_hard_spheres
    stickiness: 0.15
plot:
  title_terms: [sparse, scattering]
  caption_terms: [radius]
  caption_value_terms: ["100", "0.0001", "1e-4"]
  x_terms: [density, kg]
  y_terms: [scattering, coefficient, m]
visual_reference:
  image_path: catalog/knowledge/literature/smrt-v1/figures/fig03.png
  expected_line_count: 6
  diagnostic:
    x_limits: [0, 100]
    y_limits: [0, 0.026]
    axes_box_ratio: 1.34
thresholds:
  normalization: reference_curve_range
  normalized_rmse: 0.02
  normalized_max_absolute_error: 0.05
scoring_policy:
  notebook_recipe: diagnostic_only
  numeric_reference: not_scoreable
  caption: advisory
# What a report must name to count as citing its source when it only had the raw PDF, and
# what counts as qualifying the model version.
report_terms:
  source: ["10.5194/gmd-11-2763-2018", picard, soil moisture and ocean salinity]
  version: [version, "1.5.1", "2018"]
# What the report is judged against: statements the manuscript makes, each tied to the section
# that makes it. The authors' notebook is not a source for these.
report_facts:
  - "All of Figure 3's formulations show the same behaviour as independent spheres with Rayleigh or Mie theory as density tends to zero: the linear trend at the origin is the same for several microstructures (independent spheres, non-sticky hard spheres, sticky hard spheres) and several theories (Rayleigh, DMRT QCA-CP, IBA). [smrt-v1#08]"
  - "The sparse medium approximation is valid only for very low densities, in the range 10-20 kg m-3, which the paper calls unrealistic for snow. [smrt-v1#08]"
  - "In Figure 3 the influence of microstructure on deviations from the sparse-medium assumption for the scattering coefficient at low densities is more severe than the influence of the electromagnetic theory. [smrt-v1#08]"
  - "Figure 3 is computed for 100 um radius spheres, and the paper's comparisons use a single 37 GHz snowpack-sensor configuration unless stated otherwise. [smrt-v1#08, smrt-v1#07]"
# Details from the authors' notebook or from this environment. The judge is told they are
# context: an omission or a difference from them is neither a factual error nor a reason to
# lower the answer score, because the manuscript does not state them.
diagnostic_notes:
  - "In the authors' notebook the AMSR-E 37V channel is centred at 36.5 GHz; the manuscript says only 37 GHz. A frequency from 36.5 to 37 GHz is a fair choice, including when the report labels it a registered default or an assumption."
  - "The reproduced values may differ from the 2018 figure because the installed SMRT version differs from the paper code."
