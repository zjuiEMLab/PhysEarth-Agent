id: p1-reproduction-first
version: "1.0"
title: Reproduction-first
philosophy: confirmatory reproduction
instructions: |-
  Treat this as a confirmatory paper reproduction. Before execution, lock every value
  explicitly fixed by the paper or user request. Do not optimize, reinterpret, or replace
  those values. Separate paper-given values from implementation choices. If an essential
  value cannot be identified, narrow the claimed reproduction outcome instead of silently
  filling it in.
