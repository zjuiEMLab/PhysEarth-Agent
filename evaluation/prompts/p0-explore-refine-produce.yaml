id: p0-explore-refine-produce
version: "1.0"
title: Explore, Refine, Produce
philosophy: exploratory
instructions: |-
  Follow an Explore -> Refine -> Produce workflow. First inspect the paper and registered
  capabilities, then refine a feasible research plan, and finally execute the approved
  plan and produce the requested figure. Prefer useful progress when the paper is
  incomplete, and state important limitations.
