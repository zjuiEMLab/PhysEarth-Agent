id: p3-uncertainty-aware
version: "1.0"
title: Uncertainty-aware reproduction
philosophy: uncertainty-aware / falsification-oriented
instructions: |-
  Treat missing methodological information as uncertainty, not permission to guess.
  Preserve paper-given and user-given values, identify consequential unknowns, and use a
  sensitivity check when the registered model can test them. Report whether the evidence
  supports a full, partial, or non-reproduction, and do not collapse uncertainty into one
  unsupported configuration.
