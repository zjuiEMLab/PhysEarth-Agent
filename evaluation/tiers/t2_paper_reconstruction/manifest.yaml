tier: T2
goal: "Can the agent turn four SMRT scientific questions into reviewed, bounded, executable demonstrations?"
task_sources:
  core: evaluation/tasks/tier2
  probes: evaluation/tasks/probe
competition_tasks:
  - t1-smrt-fig4-passive
  - t1-smrt-fig4-active
  - t1-smrt-fig5-iba-shs
  - t1-smrt-fig6-memls-iba
  - p-smrt-density-above-ice
supplemental_probe_tasks:
  - p-smrt-dmrt-with-exponential-acf
  - p-smrt-arctic-underspecified
scientific_question_demos:
  - q1-sparse-medium
  - q2-dmrt-comparison
  - q3-memls-comparison
  - q4-microstructure-equivalence
metrics:
  - workflow_completion
  - capability_safety
  - source_linkage
  - pilot_contract
  - limitation_reporting
  - citation_integrity
independent_oracle:
  role: not_used_for_scientific_question_demos
  status: not_executed
  type: no_fixed_figure_target
  tasks: []
  metrics:
    - workflow_completion
    - source_linkage
    - capability_boundary
    - limitation_reporting
  warning: >-
    The four tasks are bounded scientific-question demonstrations. They intentionally do not
    claim fixed-paper-result agreement; an upstream numeric oracle can be added only after a
    separate fixed experiment is approved.
