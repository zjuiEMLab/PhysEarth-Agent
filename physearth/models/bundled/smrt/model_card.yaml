name: smrt
version: "1.5.1"
tier: demo
entrypoint: adapter:run
license: LGPL-3.0
citation: >-
  Picard, G., Sandells, M., and Lowe, H.: SMRT: an active-passive microwave radiative
  transfer model for snow with multiple microstructure and scattering formulations (v1.0),
  Geosci. Model Dev., 11, 2763-2788, 2018. https://doi.org/10.5194/gmd-11-2763-2018
description: >-
  Snow Microwave Radiative Transfer. Computes brightness temperature and backscatter from a
  homogeneous snow layer using a choice of electromagnetic theory and microstructure
  representation. Documented by the smrt-v1 paper in the literature corpus.

parameters:
  electromagnetic_model:
    type: string
    unit: none
    description: Electromagnetic theory used to obtain the scattering and absorption coefficients.
    enum: [iba, iba_original, dmrt_qca_shortrange, dmrt_qcacp_shortrange, rayleigh, symsce_torquato21]
    default: iba
  microstructure_model:
    type: string
    unit: none
    description: Representation of the snow microstructure.
    enum: [exponential, sticky_hard_spheres, independent_sphere, teubner_strey, gaussian_random_field]
    default: exponential
  output:
    type: string
    unit: none
    description: >-
      What to compute. tb is passive brightness temperature, sigma is active backscatter,
      and coefficients returns the layer's electromagnetic properties without solving
      radiative transfer at all, which is what a question about the medium rather than
      about the sensor needs.
    enum: [tb, sigma, coefficients]
    default: tb
  frequency_ghz:
    type: number
    unit: GHz
    description: Sensor frequency.
    minimum: 1.0
    maximum: 250.0
    default: 37.0
  angle_deg:
    type: number
    unit: degree
    description: Incidence angle from nadir.
    minimum: 0.0
    maximum: 80.0
    default: 55.0
  thickness_m:
    type: number
    unit: m
    description: >-
      Snow layer thickness. Thin layers over vacuum are optically shallow and unphysical.
      At microwave frequencies the result saturates within a few metres, so values far
      above that are a numerical stand-in for a semi-infinite medium rather than a real
      snowpack depth.
    minimum: 0.01
    maximum: 500.0
    default: 1.0
  density_kg_m3:
    type: number
    unit: kg m-3
    description: >-
      Snow bulk density, bounded above by pure ice. Natural snow does not fall below about
      50 kg m-3; values under that are the sparse-medium limit, where the theories are
      compared against their common first-order behaviour rather than against snow, and a
      result there is a statement about the theory and not about a snowpack.
    minimum: 1.0
    maximum: 917.0
    default: 300.0
  temperature_k:
    type: number
    unit: K
    description: Snow physical temperature. Above the melting point the dry-snow assumption fails.
    minimum: 200.0
    maximum: 273.15
    default: 265.0
  corr_length_m:
    type: number
    unit: m
    description: Exponential correlation length of the microstructure.
    minimum: 1.0e-6
    maximum: 3.0e-3
    default: 0.00015
    required: false
  radius_m:
    type: number
    unit: m
    description: Sphere radius, used by the sphere-based microstructure models.
    minimum: 1.0e-6
    maximum: 5.0e-3
    default: 0.0002
    required: false
  stickiness:
    type: number
    unit: none
    description: Stickiness of the sticky hard sphere model. Lower means more clustering.
    minimum: 0.05
    maximum: 1000.0
    default: 0.2
    required: false
  sweep_parameter:
    type: string
    unit: none
    description: Name of a numeric parameter to sweep instead of holding fixed.
    enum: [none, frequency_ghz, angle_deg, thickness_m, density_kg_m3, temperature_k, corr_length_m, radius_m]
    default: none
    required: false
  sweep_start:
    type: number
    unit: same as the swept parameter
    description: First value of the sweep.
    minimum: -1.0e+9
    maximum: 1.0e+9
    required: false
  sweep_stop:
    type: number
    unit: same as the swept parameter
    description: Last value of the sweep.
    minimum: -1.0e+9
    maximum: 1.0e+9
    required: false
  sweep_points:
    type: integer
    unit: count
    description: Number of points in the sweep.
    minimum: 2
    maximum: 60
    default: 10
    required: false

combinations:
  - when: {electromagnetic_model: [dmrt_qca_shortrange, dmrt_qcacp_shortrange]}
    allow: {microstructure_model: [sticky_hard_spheres]}
    reason: >-
      DMRT is derived for sticky hard spheres only; pairing it with another microstructure
      representation has no analytical basis in SMRT.
  - when: {microstructure_model: [exponential, teubner_strey, gaussian_random_field]}
    allow: {electromagnetic_model: [iba, iba_original, symsce_torquato21, rayleigh]}
    reason: >-
      Autocorrelation-function microstructures are used with IBA-family or Rayleigh theories,
      not with the sphere-based DMRT formulation.

outputs:
  tb_v:
    unit: K
    description: Vertically polarised brightness temperature.
    valid_min: 0.0
    valid_max: 320.0
  tb_h:
    unit: K
    description: Horizontally polarised brightness temperature.
    valid_min: 0.0
    valid_max: 320.0
  sigma_vv_db:
    unit: dB
    description: Co-polarised VV backscattering coefficient.
    valid_min: -60.0
    valid_max: 20.0
  sigma_hh_db:
    unit: dB
    description: Co-polarised HH backscattering coefficient.
    valid_min: -60.0
    valid_max: 20.0
  sigma_hv_db:
    unit: dB
    description: Cross-polarised HV backscattering coefficient.
    valid_min: -80.0
    valid_max: 20.0
  ks_per_m:
    unit: m-1
    description: >-
      Scattering coefficient of the layer, from the electromagnetic theory alone. Returned
      only by the coefficients output.
    valid_min: 0.0
    valid_max: 1000.0
  ka_per_m:
    unit: m-1
    description: Absorption coefficient of the layer, from the electromagnetic theory alone.
    valid_min: 0.0
    valid_max: 1000.0
  effective_permittivity:
    unit: none
    description: Real part of the effective permittivity of the snow layer.
    valid_min: 1.0
    valid_max: 4.0
  single_scattering_albedo:
    unit: none
    description: ks divided by the sum of ks and ka, the fraction of extinction that scatters.
    valid_min: 0.0
    valid_max: 1.0

resource_profile:
  typical_call_seconds: 0.05
  needs_gpu: false
  needs_external_data: false
  notes: >-
    Pure Python with a numba-compiled inner loop. The first call in a process pays a
    just-in-time compilation cost of a few seconds; later calls are tens of milliseconds.
