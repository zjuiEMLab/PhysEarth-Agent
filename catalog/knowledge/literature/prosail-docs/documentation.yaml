title: prosail 2.0.5 Python bindings, documentation and benchmark tests
authors: [Jose Gomez-Dans]
version: prosail 2.0.5
year: 2019
repository: https://github.com/jgomezdans/prosail
ref: 2.0.5
commit: eb96591c7ec34e8a8439fdada2d5a9f71514e3e9
license: GPL-3.0
