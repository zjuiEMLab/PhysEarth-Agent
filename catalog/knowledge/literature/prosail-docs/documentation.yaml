scenarios: [vegetation]
outputs: [reflectance, ndvi]
description: >-
  The documentation of the prosail package, the registered PROSAIL model: how the PROSPECT
  leaf model and the 4SAIL canopy model are coupled and called, what each argument means,
  and the package's own benchmark tests, which run PROSPECT-5 and 4SAIL for one stated case
  and check the result against the reference output of the original PROSAIL Fortran code.
  Read this for the PROSAIL arguments and for that benchmark case. Software documentation,
  not a peer-reviewed paper.
