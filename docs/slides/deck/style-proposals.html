<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysEarth Trust Protocol: slide style proposals</title>
<style>
:root{--page:#ecebe7;--ink:#1d1d1b;--mute:#6b6b66;--card:#fff}
@media(prefers-color-scheme:dark){:root{--page:#16161a;--ink:#ececea;--mute:#9a9a96;--card:#222228}}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:32px 20px 80px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:650;letter-spacing:-.01em}
.lede{color:var(--mute);max-width:70ch;margin:6px 0 22px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;position:sticky;top:0;background:var(--page);padding:10px 0;z-index:5}
nav a{padding:6px 12px;border:1px solid var(--mute);border-radius:99px;color:var(--ink);text-decoration:none;font-size:13px}
nav a:hover{background:var(--ink);color:var(--page)}
section.style{margin-bottom:56px}
.meta{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;margin-bottom:12px}
.meta h2{font-size:20px;font-weight:650}
.meta p{color:var(--mute);font-size:14px;flex:1 1 420px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips span{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid color-mix(in srgb,var(--mute) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.cap{font-size:12px;color:var(--mute);margin-top:4px}
/* ---------- slide frame ---------- */
.slide{aspect-ratio:16/9;container-type:inline-size;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 3px #0003,0 8px 24px #0002}
.slide>.in{position:absolute;inset:0;padding:5.5cqw 6cqw;display:flex;flex-direction:column}
.k{font-size:1.5cqw;letter-spacing:.12em;text-transform:uppercase}
.t{font-size:4.6cqw;line-height:1.08;margin:1.2cqw 0 1.6cqw}
.p{font-size:1.9cqw;line-height:1.45;max-width:62cqw}
.foot{margin-top:auto;font-size:1.25cqw;display:flex;justify-content:space-between;letter-spacing:.06em}
.row{display:grid;gap:1.6cqw;margin-top:.8cqw}
.c3{grid-template-columns:repeat(3,1fr)}
.card{padding:1.8cqw;font-size:1.55cqw;line-height:1.4}
.card b{display:block;font-size:2.3cqw;margin:.4cqw 0 .6cqw}
.card i{font-style:normal;display:block;font-size:1.25cqw;opacity:.85;margin-top:.8cqw}
.stats{display:flex;gap:5cqw;margin-top:2.4cqw}
.stat .n{font-size:9cqw;line-height:1}
.stat .l{font-size:1.6cqw;max-width:22cqw;margin-top:.6cqw}
table{border-collapse:collapse;width:100%;font-size:1.5cqw;margin-top:.6cqw}
th{text-align:left;font-weight:600;font-size:1.2cqw;letter-spacing:.1em;text-transform:uppercase;padding:.9cqw 1cqw}
td{padding:1cqw 1cqw;vertical-align:top}
.tag{font-size:1.1cqw;padding:.2cqw .7cqw;border-radius:99px;white-space:nowrap;letter-spacing:.05em}
.dot{position:absolute;pointer-events:none}
.cover .t{font-size:6.4cqw;max-width:60cqw}

/* ---------- 0 Editorial paper (current) ---------- */
.s0{background:#f8f6f2;color:#222b27;font-family:Arial,sans-serif}
.s0 .k{font-family:"Courier New",monospace;color:#c4532f;font-weight:700}
.s0 .t{font-family:Georgia,serif;font-weight:700}
.s0 .card{background:#fff;border:1px solid #e3ddd3}.s0 .card b{font-family:Georgia,serif}
.s0 .stat .n{font-family:Georgia,serif;font-weight:700;color:#c4532f}
.s0 .foot{font-family:"Courier New",monospace;color:#5b625e}
.s0 th{font-family:"Courier New",monospace;color:#5b625e;border-bottom:1px solid #222b27}
.s0 td{border-bottom:1px solid #e3ddd3}.s0 .tag{background:#c4532f1a;color:#c4532f;font-family:"Courier New",monospace;font-weight:700}
.s0.dark{background:#26211d;color:#f8f6f2}.s0.dark .k{color:#f0a98a}
/* ---------- 1 Swiss journal ---------- */
.s1{background:#fff;color:#0b0b0b;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.s1 .in{background-image:linear-gradient(#0b0b0b0d 1px,transparent 1px),linear-gradient(90deg,#0b0b0b0d 1px,transparent 1px);background-size:8.33cqw 8.33cqw;background-position:6cqw 5.5cqw}
.s1 .k{font-weight:700;color:#e30613;letter-spacing:.04em}
.s1 .t{font-weight:800;letter-spacing:-.035em;font-size:5.4cqw}
.s1 .card{border-top:.5cqw solid #0b0b0b;padding:1.2cqw 0 0;background:transparent}.s1 .card b{font-size:2.6cqw;letter-spacing:-.02em}
.s1 .stat .n{font-weight:800;letter-spacing:-.06em;font-size:13cqw;color:#e30613}
.s1 .foot{border-top:1px solid #0b0b0b;padding-top:.7cqw;font-weight:600}
.s1 th{border-bottom:.3cqw solid #0b0b0b;font-weight:800}.s1 td{border-bottom:1px solid #0b0b0b26}
.s1 .tag{background:#0b0b0b;color:#fff;border-radius:0}.s1 .tag.o{background:#e30613}
.s1 .big{position:absolute;right:5cqw;top:4cqw;font-size:30cqw;font-weight:800;letter-spacing:-.08em;color:#e30613;line-height:.8}
/* ---------- 2 Nature-style paper ---------- */
.s2{background:#fff;color:#1a1a1a;font-family:Charter,"Iowan Old Style",Georgia,serif}
.s2 .k{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:#0b6e4f;font-size:1.35cqw}
.s2 .t{font-weight:400;font-size:4.2cqw;letter-spacing:-.01em}
.s2 .p{font-size:2cqw}
.s2 .card{background:#f3f7f5;border-radius:3px}.s2 .card b{font-weight:600}
.s2 .card::before{content:attr(data-n);display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:#0b6e4f;font-size:1.3cqw;letter-spacing:.1em}
.s2 .stat .n{color:#0b6e4f;font-weight:400}
.s2 .foot{font-family:"Helvetica Neue",Arial,sans-serif;color:#666;border-top:1px solid #ccc;padding-top:.8cqw}
.s2 th{font-family:"Helvetica Neue",Arial,sans-serif;border-top:.25cqw solid #1a1a1a;border-bottom:1px solid #1a1a1a}
.s2 table{border-bottom:.25cqw solid #1a1a1a}.s2 td{border-bottom:none}
.s2 .tag{font-family:"Helvetica Neue",Arial,sans-serif;background:#0b6e4f1a;color:#0b6e4f;font-weight:700}
.s2 .figcap{font-size:1.4cqw;color:#555;margin-top:1cqw}.s2 .figcap b{color:#1a1a1a}
/* ---------- 3 Midnight instrument ---------- */
.s3{background:#0c1220;color:#dbe4f3;font-family:"Helvetica Neue",Arial,sans-serif}
.s3 .in{background:radial-gradient(60cqw 40cqw at 85% 0%,#1b3a6b55,transparent 70%)}
.s3 .k{font-family:"SF Mono","Courier New",monospace;color:#35d0ba}
.s3 .t{font-weight:600;color:#fff}
.s3 .card{background:#141c30;border:1px solid #26334f;border-radius:1cqw}.s3 .card b{color:#fff}
.s3 .card:nth-child(1){box-shadow:inset 0 .3cqw 0 #35d0ba}.s3 .card:nth-child(2){box-shadow:inset 0 .3cqw 0 #ffb454}.s3 .card:nth-child(3){box-shadow:inset 0 .3cqw 0 #7aa2ff}
.s3 .stat .n{font-family:"SF Mono","Courier New",monospace;color:#ffb454}
.s3 .foot{font-family:"SF Mono","Courier New",monospace;color:#7d8bab}
.s3 th{font-family:"SF Mono","Courier New",monospace;color:#7d8bab;border-bottom:1px solid #26334f}.s3 td{border-bottom:1px solid #1d2842}
.s3 .tag{background:#35d0ba22;color:#35d0ba;font-family:"SF Mono","Courier New",monospace}.s3 .tag.o{background:#ffb45422;color:#ffb454}
.s3 .meter{height:.8cqw;background:#26334f;border-radius:9px;margin-top:1.2cqw;overflow:hidden}.s3 .meter i{display:block;height:100%;background:#35d0ba;margin:0;border-radius:9px}
/* ---------- 4 Terrain ---------- */
.s4{background:#f2eee3;color:#1f2f27;font-family:"Avenir Next","Gill Sans",Arial,sans-serif}
.s4 .contour{position:absolute;inset:0;opacity:.9}
.s4 .k{color:#2d5a3d;font-weight:700}
.s4 .t{font-family:Palatino,"Palatino Linotype",serif;font-weight:700;color:#1f3d2e}
.s4 .card{background:#fbf9f2e8;border-radius:1.2cqw;border:1px solid #c9c3ad}.s4 .card b{font-family:Palatino,serif;color:#1f3d2e}
.s4 .stat .n{font-family:Palatino,serif;font-weight:700;color:#b5532a}
.s4 .foot{color:#4b5d51}
.s4 th{color:#4b5d51;border-bottom:1.5px solid #1f3d2e}.s4 td{border-bottom:1px dashed #b7b196}
.s4 .tag{background:#2d5a3d1c;color:#2d5a3d;font-weight:700}.s4 .tag.o{background:#b5532a1f;color:#b5532a}
.s4.dark{background:#17261d;color:#e8e4d3}.s4.dark .t{color:#f2eee3}.s4.dark .k{color:#a9d3a0}
/* ---------- 5 Blueprint ---------- */
.s5{background:#12337a;color:#e8f0ff;font-family:"SF Mono","Courier New",monospace}
.s5 .in{background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:2.5cqw 2.5cqw}
.s5 .k{color:#ffd23f}
.s5 .t{font-weight:700;letter-spacing:-.02em;font-size:4.2cqw}
.s5 .p{font-family:"Helvetica Neue",Arial,sans-serif}
.s5 .card{border:1.5px solid #e8f0ff;background:#12337acc;position:relative;font-family:"Helvetica Neue",Arial,sans-serif}.s5 .card b{font-family:"SF Mono","Courier New",monospace;color:#ffd23f}
.s5 .card::after{content:"";position:absolute;right:-1.6cqw;top:50%;width:1.6cqw;border-top:1.5px dashed #e8f0ff}.s5 .card:last-child::after{display:none}
.s5 .stat .n{color:#ffd23f}
.s5 .foot{color:#a9c1f0}
.s5 th{color:#ffd23f;border-bottom:1.5px solid #e8f0ff}.s5 td{border-bottom:1px dashed #e8f0ff55;font-family:"Helvetica Neue",Arial,sans-serif}
.s5 .tag{border:1px solid #ffd23f;color:#ffd23f;border-radius:0}.s5 .tag.o{border-color:#fff;color:#fff}
/* ---------- 6 Bento ---------- */
.s6{background:#eef0f6;color:#171a2b;font-family:"Helvetica Neue",Arial,sans-serif}
.s6 .k{color:#5b4bdb;font-weight:700}
.s6 .t{font-weight:750;letter-spacing:-.03em}
.s6 .card{border-radius:1.6cqw;padding:2cqw;color:#171a2b;min-height:20cqw}
.s6 .card:nth-child(1){background:#d9d4ff}.s6 .card:nth-child(2){background:#ffe3c7}.s6 .card:nth-child(3){background:#c8f0e0}
.s6 .stat{background:#fff;border-radius:1.8cqw;padding:2cqw 2.4cqw;box-shadow:0 .2cqw .8cqw #171a2b14}
.s6 .stat:first-child{background:#171a2b;color:#fff}.s6 .stat .n{font-weight:800;letter-spacing:-.05em}
.s6 .foot{color:#6a6f88}
.s6 table{border-collapse:separate;border-spacing:0 .7cqw}.s6 td,.s6 th{background:#fff}.s6 th{background:transparent}
.s6 td:first-child{border-radius:1cqw 0 0 1cqw}.s6 td:last-child{border-radius:0 1cqw 1cqw 0}
.s6 .tag{background:#5b4bdb;color:#fff}.s6 .tag.o{background:#ff8a3d}
</style>
</head>
<body>
<div class="wrap">
<h1>PhysEarth Trust Protocol: slide style proposals</h1>
<p class="lede">Six looks for the 12-minute competition talk. Each style is shown on the same four slides from your deck (cover, problem, protocol A/B/C, Protocol B scores) so you can compare like for like. Style 0 is the current build, for reference.</p>
<nav id="nav"></nav>
<div id="out"></div>
</div>

<script>
const STYLES=[
{id:0,name:"Editorial paper (current)",desc:"Warm paper, Georgia headlines, mono kickers, burnt-orange accent. Reads like a magazine feature. The baseline.",chips:["Georgia + Courier","F8F6F2 / C4532F","light + dark sandwich"]},
{id:1,name:"Swiss journal",desc:"White, one signal red, huge grotesque numerals on a visible 12-column grid. Maximum legibility from the back of a conference hall. Numbers (20/20, 40%) become the visual.",chips:["Helvetica Neue ExtraBold","FFFFFF / 0B0B0B / E30613","grid + flat rules, no shadows"]},
{id:2,name:"Nature paper",desc:"Looks like a figure page from the journal: serif body, small-caps style kickers, three-line booktabs tables, figure captions. Most credible for IEEE/academic judges.",chips:["Charter serif + Helvetica labels","FFFFFF / 0B6E4F green","booktabs tables, Fig. captions"]},
{id:3,name:"Midnight instrument",desc:"Dark graphite-navy with teal, amber and periwinkle as three semantic channels (A / B / C). Suits the gates-and-scores story and a projector in a dim room; the demo video blends in.",chips:["Helvetica + SF Mono","0C1220 / 35D0BA / FFB454","dark throughout"]},
{id:4,name:"Terrain",desc:"Topographic contour lines behind sand paper, forest green with a rust highlight. Signals Earth science without a stock globe; the contour field is a repeatable motif for every slide.",chips:["Palatino + Avenir","F2EEE3 / 1F3D2E / B5532A","SVG contours, dark variant"]},
{id:5,name:"Blueprint",desc:"Engineering-drawing blue with a drafting grid, white linework and a yellow annotation colour. The protocol is literally drawn as a spec: boxes joined by dashed flow lines.",chips:["SF Mono + Helvetica","12337A / FFD23F","grid, dashed connectors"]},
{id:6,name:"Bento cards",desc:"Soft modular tiles in pastel, one dark tile for the headline number. Friendly and modern; good for the product/deliverables half, weaker for dense tables.",chips:["Helvetica Neue","EEF0F6 / 5B4BDB / pastels","rounded tiles"]}
];
const dots=n=>`<div class="foot"><span>PHYSEARTH-AGENT</span><span>${n}</span></div>`;
function contour(){let p="";for(let i=0;i<9;i++){const r=6+i*5.2;p+=`<ellipse cx="${78+i*.6}" cy="${96-i*1.2}" rx="${r*1.5}" ry="${r}" transform="rotate(-18 78 90)" fill="none" stroke="#2d5a3d" stroke-opacity="${.28-i*.018}" stroke-width=".28"/>`}
for(let i=0;i<6;i++){const r=4+i*4.4;p+=`<ellipse cx="${8-i*.4}" cy="${6+i*.5}" rx="${r*1.3}" ry="${r}" transform="rotate(22 8 8)" fill="none" stroke="#2d5a3d" stroke-opacity="${.22-i*.02}" stroke-width=".28"/>`}
return `<svg class="contour" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid slice">${p}</svg>`}
function slides(s){
 const x=s.id, T4=x==4?contour():"";
 const dark0=x==0?" dark":"";
 const cover=`<div class="slide s${x}${dark0} cover">${T4}${x==1?'<div class="big">?</div>':''}<div class="in">
  <div class="k">${x==2?"Trust protocol for physical-model agents":"Open source GeoAI practice · IEEE AP-GARSS 2026"}</div>
  <div class="t" style="margin-top:auto">Can you trust a run of a physical model?</div>
  <div class="p">An agent for physics-based Earth models, and the protocol that scores whether its runs can be trusted.</div>
  <div style="height:3cqw"></div>${dots("1 / 21")}</div></div>`;
 const prob=`<div class="slide s${x}">${T4}<div class="in">
  <div class="k">01 · The problem</div><div class="t">Physical models fail silently.</div>
  <div class="p">Ask for snow denser than ice and the model still returns a smooth, plausible curve. Nothing crashes, nothing warns.</div>
  <div class="stats"><div class="stat"><div class="n">40%</div><div class="l">accuracy of code agents on UnivEARTH</div></div>
  <div class="stat"><div class="n">&gt;44%</div><div class="l">of generated code does not even run</div></div></div>
  ${dots("2 / 21")}</div></div>`;
 const abc=[["A","Register & guard","Is the model what its card says, and does the system enforce it?","20/20 checks · 0 LLM calls"],["B","Reproduce","Does the run match the paper, and does it name what it assumed?","Figure judge · provenance"],["C","Afford","What does a trusted run cost in time, tokens and effort?","4-5 min · 0.7M tokens"]];
 const proto=`<div class="slide s${x}">${T4}<div class="in">
  <div class="k">03 · How can we trust the model?</div><div class="t">Trust is a protocol, not a claim.</div>
  <div class="row c3">${abc.map(a=>`<div class="card" data-n="PROTOCOL ${a[0]}"><b>${x==5?a[0]+" · ":""}${x==6?"":""}${a[1]}</b>${a[2]}<i>${a[3]}</i>${x==3?`<div class="meter"><i style="width:${[100,66,82][abc.indexOf(a)]}%"></i></div>`:""}</div>`).join("")}</div>
  ${dots("4 / 21")}</div></div>`;
 const rows=[["Execution rate","Did the run finish?","DONE"],["Figure: visual judge","Same curves, order, grouping as the paper?","DONE"],["Figure: numeric error","How far from the authors' own code?","1 WK"],["Provenance","Which values were assumed?","CHECK 1 WK"],["Report judge","Is the write-up true and calibrated?","DONE"]];
 const tab=`<div class="slide s${x}">${T4}<div class="in">
  <div class="k">07 · Protocol B</div><div class="t" style="font-size:${x==1?4.6:3.8}cqw">Reproduce Figure 3. What approves it?</div>
  <table><tr><th>Score</th><th>Question it answers</th><th>Status</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="tag ${r[2]=="DONE"?"":"o"}">${r[2]}</span></td></tr>`).join("")}</table>
  ${x==2?'<div class="figcap"><b>Table 1.</b> Protocol B scores. Every metric is recomputed from the recorded run.</div>':''}
  ${dots("10 / 21")}</div></div>`;
 return [cover,prob,proto,tab];
}
const nav=document.getElementById("nav"),out=document.getElementById("out");
const cap=["Cover","Problem + stats","Three protocols","Scores table"];
STYLES.forEach(s=>{
 nav.insertAdjacentHTML("beforeend",`<a href="#s${s.id}">${s.id}. ${s.name.replace(" (current)","")}</a>`);
 out.insertAdjacentHTML("beforeend",`<section class="style" id="s${s.id}"><div class="meta"><h2>${s.id}. ${s.name}</h2><p>${s.desc}</p></div><div class="chips">${s.chips.map(c=>`<span>${c}</span>`).join("")}</div><div class="grid">${slides(s).map((h,i)=>`<div>${h}<div class="cap">${cap[i]}</div></div>`).join("")}</div></section>`);
});
</script>
</body>
</html>
