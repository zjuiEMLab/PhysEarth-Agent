title: Reporting a result so it can be checked
description: 'How to put a number into an answer so a reader can check it: saying whether each number
  was computed, measured, reported or derived, giving the configuration with the value, stating the limits
  of validity and idealisation, and reporting a null result as a result. Read this before writing the
  final answer of anything that contains a number.'
