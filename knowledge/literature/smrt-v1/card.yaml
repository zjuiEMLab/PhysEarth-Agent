modified: Full text extracted from the publisher JATS XML and split into sections. Publisher figure assets
  are retained separately with captions and source provenance. Tables and reference lists are not included
  in the bundled text. Wording unchanged.
description: 'Reference description of the SMRT model itself: how snowpacks are declared, which electromagnetic
  theories (IBA, DMRT, Rayleigh) and microstructure representations (exponential, sticky hard spheres,
  Gaussian random field, Teubner-Strey) are available, how they relate, and what each one assumes. Read
  this first when choosing or justifying SMRT run parameters.'
