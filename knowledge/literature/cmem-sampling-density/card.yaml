description: Uses the Community Microwave Emission Modelling platform (CMEM) to simulate L-band brightness
  temperature over land and to ask how densely ground soil moisture and brightness temperature must be
  sampled to calibrate and validate satellite observations. Read this for the tau-omega emission chain
  and for scale and sampling arguments.
