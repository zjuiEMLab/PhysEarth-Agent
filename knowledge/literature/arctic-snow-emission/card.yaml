description: SMRT applied to Arctic snow emission in surface-sensitive atmospheric sounding channels at
  89 to 243 GHz, evaluated against airborne radiometry with measured snow microstructure. Read this for
  a high-frequency validation case, for how measured microstructure is turned into model input, and for
  the limits of the model at frequencies far above the usual 19 to 37 GHz range.
