description: 'Trail Valley Creek 2018/19 experiment: retrieval of snow and soil properties for forward
  modelling of airborne Ku-band SAR to estimate snow water equivalent. Uses SMRT end to end with real
  field measurements at C, X and Ku band, and reports the retrieved soil roughness, soil permittivity
  and grain polydispersity values. Read this for a complete worked application and for realistic parameter
  values.'
