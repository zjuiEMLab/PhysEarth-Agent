description: 'MEMLS3&a: the Microwave Emission Model of Layered Snowpacks extended to also compute backscatter.
  Explains the improved Born approximation, correlation length as the microstructure parameter, and how
  an emission model is turned into an active one. Read this when comparing passive and active formulations
  of the same snowpack.'
