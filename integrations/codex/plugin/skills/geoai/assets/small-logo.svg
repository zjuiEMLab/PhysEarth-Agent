<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PhysEarth Geo-AI">
  <title>PhysEarth Geo-AI</title>
  <!-- The mark reads as three things at once, which is what the engine is: a globe
       (Earth), a layered profile (a physical model run against declared ranges), and a
       six-fold star (ice and snow, the corpus's densest domain). No text: it has to
       survive 24 px. -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#1F6FEB" stroke-width="4"/>
  <ellipse cx="32" cy="32" rx="13" ry="30" fill="none" stroke="#1F6FEB" stroke-width="2.5" opacity="0.75"/>
  <path d="M2.5 32h59" fill="none" stroke="#1F6FEB" stroke-width="2.5" opacity="0.75"/>
  <path d="M8 17.5h48M8 46.5h48" fill="none" stroke="#1F6FEB" stroke-width="2" opacity="0.45"/>
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 20v24M21.6 26v12M42.4 26v12"/>
    <path d="M21.6 26l20.8 12M42.4 26L21.6 38"/>
  </g>
</svg>
