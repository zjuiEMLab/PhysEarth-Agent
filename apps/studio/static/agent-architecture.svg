<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PhysEarth-Agent compared with a conventional LLM, RAG and model-code pipeline</title>
  <desc id="desc">A side-by-side architecture diagram showing how the PhysEarth research harness adds planning, approval, registered model execution, validation, provenance, figure review and citation gates.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#87908f"/>
    </marker>
    <marker id="arrow-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97757"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#253230" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .ink { fill: #222a29; }
      .muted { fill: #697371; }
      .clay { fill: #d97757; }
      .blue { fill: #3b79ad; }
      .small { font-size: 20px; }
      .body { font-size: 24px; }
      .node-title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
      .panel-title { font-size: 36px; font-weight: 700; }
    </style>
  </defs>

  <rect width="2000" height="1200" fill="#fbfaf7"/>
  <circle cx="1890" cy="80" r="220" fill="#d97757" opacity="0.055"/>
  <circle cx="85" cy="1120" r="240" fill="#3b79ad" opacity="0.045"/>

  <text x="80" y="78" class="mono label clay">ARCHITECTURE COMPARISON</text>
  <text x="80" y="142" class="serif ink" font-size="54" font-weight="700">From a plausible answer to a reproducible result.</text>
  <text x="80" y="187" class="sans muted" font-size="25">The LLM proposes actions; the harness controls what may run, what counts as evidence, and what may be claimed.</text>

  <!-- Conventional pipeline -->
  <rect x="70" y="238" width="610" height="776" rx="22" fill="#f2f1ed" stroke="#c8cdca" stroke-width="2"/>
  <text x="105" y="288" class="mono label muted">TYPICAL APPROACH</text>
  <text x="105" y="337" class="serif panel-title ink">LLM + RAG + model code</text>
  <text x="105" y="374" class="sans small muted">A short answer-generation pipeline</text>

  <g filter="url(#shadow)">
    <rect x="115" y="418" width="520" height="82" rx="13" fill="#ffffff" stroke="#c8cdca"/>
    <rect x="115" y="528" width="520" height="82" rx="13" fill="#ffffff" stroke="#c8cdca"/>
    <rect x="115" y="638" width="520" height="82" rx="13" fill="#ffffff" stroke="#c8cdca"/>
    <rect x="115" y="748" width="520" height="82" rx="13" fill="#ffffff" stroke="#c8cdca"/>
  </g>
  <text x="375" y="468" text-anchor="middle" class="sans node-title ink">Research question</text>
  <text x="375" y="578" text-anchor="middle" class="sans node-title ink">Retrieve documents (RAG)</text>
  <text x="375" y="688" text-anchor="middle" class="sans node-title ink">LLM writes / calls model code</text>
  <text x="375" y="798" text-anchor="middle" class="sans node-title ink">Narrative answer + plot</text>
  <path d="M375 500 V520 M375 610 V630 M375 720 V740" stroke="#87908f" stroke-width="3" marker-end="url(#arrow-gray)"/>

  <rect x="115" y="866" width="520" height="112" rx="14" fill="#fff7ef" stroke="#e4b36e" stroke-width="2"/>
  <text x="140" y="901" class="mono label" fill="#a96619">COMMON FAILURE MODES</text>
  <text x="140" y="935" class="sans small muted">Ad-hoc parameters · no approval · weak provenance</text>
  <text x="140" y="965" class="sans small muted">Plausible-looking output can outrun its evidence</text>

  <!-- Divider -->
  <line x1="725" y1="252" x2="725" y2="1000" stroke="#c8cdca" stroke-width="2" stroke-dasharray="7 9"/>
  <circle cx="725" cy="620" r="34" fill="#fbfaf7" stroke="#d97757" stroke-width="2"/>
  <text x="725" y="628" text-anchor="middle" class="mono" font-size="20" font-weight="800" fill="#d97757">VS</text>

  <!-- PhysEarth pipeline -->
  <rect x="770" y="238" width="1160" height="776" rx="22" fill="#ffffff" stroke="#d97757" stroke-width="3" filter="url(#shadow)"/>
  <text x="810" y="288" class="mono label clay">PHYSEARTH-AGENT</text>
  <text x="810" y="337" class="serif panel-title ink">LLM inside a scientific research harness</text>
  <text x="810" y="374" class="sans small muted">A controlled, reviewable and recoverable experiment pipeline</text>
  <rect x="1450" y="356" width="19" height="19" rx="4" fill="#eef4fa" stroke="#90b4d4"/>
  <text x="1480" y="372" class="mono" font-size="15" font-weight="800" fill="#557d9e">SHARED CORE</text>
  <rect x="1650" y="356" width="19" height="19" rx="4" fill="#fff1e7" stroke="#d97757" stroke-width="2"/>
  <text x="1680" y="372" class="mono" font-size="15" font-weight="800" fill="#bd5d3e">HARNESS-ADDED</text>

  <!-- Evidence rail -->
  <rect x="810" y="408" width="1080" height="76" rx="14" fill="#fff2e9" stroke="#d97757" stroke-width="2.5"/>
  <text x="840" y="439" class="mono label" fill="#bd5d3e">ADDED · EVIDENCE BOUNDARY</text>
  <text x="840" y="469" class="sans small muted">Bundled papers + section-level citations · online literature · model cards · measured datasets</text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="810" y="530" width="178" height="112" rx="13" fill="#eef4fa" stroke="#90b4d4"/>
    <rect x="1018" y="530" width="204" height="112" rx="13" fill="#fff7f1" stroke="#d97757" stroke-width="2.5"/>
    <rect x="1252" y="530" width="204" height="112" rx="13" fill="#fff4e7" stroke="#d97757" stroke-width="2.5"/>
    <rect x="1486" y="530" width="178" height="112" rx="13" fill="#f4f8f3" stroke="#d97757" stroke-width="2.5"/>
    <rect x="1694" y="530" width="196" height="112" rx="13" fill="#f4f8f3" stroke="#d97757" stroke-width="2.5"/>
  </g>
  <text x="899" y="573" text-anchor="middle" class="sans node-title ink">Question +</text>
  <text x="899" y="606" text-anchor="middle" class="sans node-title ink">evidence</text>
  <text x="1120" y="568" text-anchor="middle" class="sans node-title ink">Research plan</text>
  <text x="1120" y="599" text-anchor="middle" class="sans small muted">pseudo-preview</text>
  <text x="1120" y="626" text-anchor="middle" class="sans small muted">human approval</text>
  <text x="1354" y="568" text-anchor="middle" class="sans node-title ink">Registered</text>
  <text x="1354" y="599" text-anchor="middle" class="sans node-title ink">physical model</text>
  <text x="1354" y="627" text-anchor="middle" class="sans small muted">validated inputs</text>
  <text x="1575" y="568" text-anchor="middle" class="sans node-title ink">Result +</text>
  <text x="1575" y="599" text-anchor="middle" class="sans node-title ink">Figure QA</text>
  <text x="1575" y="627" text-anchor="middle" class="sans small muted">auto-redraw</text>
  <text x="1792" y="568" text-anchor="middle" class="sans node-title ink">Cited report</text>
  <text x="1792" y="599" text-anchor="middle" class="sans small muted">claims bound to</text>
  <text x="1792" y="627" text-anchor="middle" class="sans small muted">runs + sources</text>
  <path d="M988 586 H1008 M1222 586 H1242 M1456 586 H1476 M1664 586 H1684" stroke="#d97757" stroke-width="4" marker-end="url(#arrow-clay)"/>

  <!-- Harness controls -->
  <rect x="810" y="694" width="1080" height="206" rx="16" fill="#fff2e9" stroke="#d97757" stroke-width="3"/>
  <text x="840" y="732" class="mono label" fill="#bd5d3e">WHAT PHYSEARTH ADDS · HARNESS CONTROL PLANE</text>
  <g>
    <rect x="840" y="758" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1100" y="758" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1360" y="758" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1620" y="758" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="840" y="828" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1100" y="828" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1360" y="828" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
    <rect x="1620" y="828" width="240" height="54" rx="9" fill="#ffffff" stroke="#e4a28d" stroke-width="1.5"/>
  </g>
  <text x="960" y="792" text-anchor="middle" class="sans small ink" font-weight="700">Workflow + recovery</text>
  <text x="1220" y="792" text-anchor="middle" class="sans small ink" font-weight="700">Human approval gates</text>
  <text x="1480" y="792" text-anchor="middle" class="sans small ink" font-weight="700">Physical validation</text>
  <text x="1740" y="792" text-anchor="middle" class="sans small ink" font-weight="700">Model registry</text>
  <text x="960" y="862" text-anchor="middle" class="sans small ink" font-weight="700">Result store + replay</text>
  <text x="1220" y="862" text-anchor="middle" class="sans small ink" font-weight="700">Figure quality review</text>
  <text x="1480" y="862" text-anchor="middle" class="sans small ink" font-weight="700">Citation integrity</text>
  <text x="1740" y="862" text-anchor="middle" class="sans small ink" font-weight="700">Audit trace + memory</text>

  <text x="810" y="946" class="mono small muted">LLM: proposes and interprets</text>
  <text x="1165" y="946" class="mono small muted">HARNESS: authorizes, validates, records and recovers</text>
  <path d="M960 925 H1860" stroke="#d97757" stroke-width="3"/>

  <!-- Outcomes -->
  <rect x="70" y="1050" width="910" height="105" rx="18" fill="#edf6ef" stroke="#91b99a" stroke-width="2"/>
  <circle cx="120" cy="1102" r="25" fill="#4e875b"/>
  <text x="120" y="1110" text-anchor="middle" class="sans" font-size="25" font-weight="800" fill="#ffffff">1</text>
  <text x="165" y="1091" class="serif" font-size="29" font-weight="700" fill="#315f3b">Process-driven reproduction</text>
  <text x="165" y="1126" class="sans small muted">Reviewable plans → repeatable model runs → checked figures → recoverable execution</text>

  <rect x="1010" y="1050" width="920" height="105" rx="18" fill="#f0edf7" stroke="#b8a9d2" stroke-width="2"/>
  <circle cx="1060" cy="1102" r="25" fill="#715a96"/>
  <text x="1060" y="1110" text-anchor="middle" class="sans" font-size="25" font-weight="800" fill="#ffffff">2</text>
  <text x="1105" y="1091" class="serif" font-size="29" font-weight="700" fill="#594676">Evidence-constrained trust</text>
  <text x="1105" y="1126" class="sans small muted">Every conclusion is traceable to literature, model declarations and actual outputs</text>
</svg>
